<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}StudyAI{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="navbar"><a class="brand" href="{{ url_for('main.index') }}"><span class="brand-icon">✦</span> StudyAI</a><nav><a href="{{ url_for('main.index') }}">Dashboard</a><a class="nav-button" href="{{ url_for('main.upload') }}">+ Add Material</a></nav></header>
<main class="container">
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</main>
<footer><p>StudyAI • AI Study Material Organizer</p></footer>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body></html>
